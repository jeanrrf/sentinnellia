<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Titanium Silver Gradients -->
    <linearGradient id="silver-main" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="silver-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Electric Cyan Glowing Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Cyan Drop Shadow Filter for realism -->
    <filter id="cyan-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00E5FF" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(10, 8)">
    <!-- 1. Left Major Diagonal Arm (Silver Metallic) -->
    <path
      d="M50 4 L14 78 L31 78 L53 32 Z"
      fill="url(#silver-main)"
    />

    <!-- 2. Right Upper Diagonal Leg -->
    <path
      d="M50 4 L53 32 L78 72 L93 62 Z"
      fill="url(#silver-dark)"
    />

    <!-- 3. Inner Cyan Glowing Diagonal Beam -->
    <path
      d="M51 34 L67 60 L60 67 L44 41 Z"
      fill="url(#cyan-glow)"
      filter="url(#cyan-shadow)"
    />

    <!-- 4. Lower Right Corner Cyan Accent Triangle -->
    <path
      d="M87 78 L97 78 L92 68 Z"
      fill="url(#cyan-glow)"
      filter="url(#cyan-shadow)"
    />

    <!-- 5. Inner Lower Chevron Fold (Silver Titanium) -->
    <path
      d="M44 42 L31 78 L49 78 L63 56 Z"
      fill="url(#silver-light)"
    />
  </g>
</svg>
